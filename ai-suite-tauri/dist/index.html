<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Suite v4.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;background:#0b1120;color:#e2e8f0;
  display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;
  -webkit-font-smoothing:antialiased}
.spinner{width:40px;height:40px;border:3px solid #334155;border-top-color:#818cf8;
  border-radius:50%;animation:spin .7s linear infinite;margin-bottom:24px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-size:22px;font-weight:700;background:linear-gradient(135deg,#818cf8,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-0.02em}
p{color:#94a3b8;font-size:14px}
.features{display:flex;gap:24px;margin-top:32px}
.features span{font-size:12px;color:#64748b;padding:4px 12px;border:1px solid #334155;border-radius:20px}
.status{color:#818cf8;font-size:12px;margin-top:20px;animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
</style>
<script>
let attempts=0;
function check(){
  fetch('http://127.0.0.1:5000/api/status',{signal:AbortSignal.timeout(2000)})
    .then(r=>{if(r.ok)window.location.href='http://127.0.0.1:5000/chat';})
    .catch(()=>{attempts++;if(attempts<60)setTimeout(check,1500);});
}
check();
</script>
</head>
<body>
<div class="spinner"></div>
<h2>AI Suite v4.2</h2>
<p>53 工具 · 多 Agent 协作 · 自进化 · 生图/生视频 · 7 新模块</p>
<div class="features">
  <span>🔧 53工具</span><span>🤖 Agent</span><span>🎨 生图</span><span>🎬 视频</span><span>📄 文档</span>
</div>
<p class="status">服务启动中...</p>
</body>
</html>
