[package]
name = "ai-suite"
version = "4.1.0"
edition = "2021"
description = "AI Suite Desktop — Agent-powered AI assistant"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "=0.3.47"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "ai_suite_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
