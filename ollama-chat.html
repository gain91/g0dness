<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>g0dness - AI Suite</title>
<style>
/* ═══════════════════════════════════════════
   AI Suite v3.3 — Design System
   Inspired by: ChatGPT Desktop · Raycast · Linear
   ═══════════════════════════════════════════ */
:root {
  --bg: #f8fafc; --surface: #fff; --border: #e2e8f0;
  --text: #0f172a; --muted: #64748b; --subtle: #94a3b8;
  --accent: #6366f1; --accent-hover: #4f46e5; --accent-light: #eef2ff;
  --header-bg: rgba(255,255,255,.8); --sidebar-bg: #f1f5f9;
  --input-bg: #fff; --msg-user-bg: #6366f1; --msg-user-text: #fff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04); --shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.06),0 2px 4px -2px rgba(0,0,0,.04);
  --radius-sm: 8px; --radius: 12px; --radius-lg: 16px; --radius-xl: 20px;
  --transition: .2s cubic-bezier(.4,0,.2,1);
}
.theme-dark {
  --bg: #0b1120; --surface: #1e293b; --border: #334155;
  --text: #e2e8f0; --muted: #94a3b8; --subtle: #64748b;
  --accent: #818cf8; --accent-hover: #6366f1; --accent-light: #1e1b4b;
  --header-bg: rgba(15,23,42,.85); --sidebar-bg: #0f172a;
  --input-bg: #1e293b; --msg-user-bg: #6366f1; --msg-user-text: #fff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.2); --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 6px rgba(0,0,0,.3);
}
.theme-light {
  --bg: #fff; --surface: #fff; --border: #e5e7eb;
  --text: #111827; --muted: #6b7280; --subtle: #9ca3af;
  --accent: #2563eb; --accent-hover: #1d4ed8; --accent-light: #eff6ff;
  --header-bg: rgba(255,255,255,.9); --sidebar-bg: #f9fafb;
  --input-bg: #f9fafb; --msg-user-bg: #2563eb; --msg-user-text: #fff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
}

/* ── Header ── */
.header {
  background:var(--header-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  padding:8px 16px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--border); flex-wrap:nowrap; overflow-x:auto; z-index:100;
}
.header h1 {
  font-size:15px; font-weight:700; background:linear-gradient(135deg,var(--accent),#a855f7);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; white-space:nowrap; margin-right:4px;
}
.header select {
  background:var(--input-bg); color:var(--text); border:1px solid var(--border); padding:5px 10px;
  border-radius:var(--radius-sm); font-size:12px; flex-shrink:0; cursor:pointer; outline:none;
  transition:var(--transition);
}
.header select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
.header .theme-btn {
  background:none; border:1px solid var(--border); color:var(--muted); cursor:pointer;
  padding:5px 9px; border-radius:var(--radius-sm); font-size:14px; transition:var(--transition);
}
.header .theme-btn:hover { background:var(--accent-light); color:var(--accent); border-color:var(--accent); }

/* ── Mode Tabs ── */
.mode-tabs { display:flex; gap:2px; margin-left:auto; background:var(--border); border-radius:var(--radius-sm); padding:2px; }
.mode-tab {
  background:transparent; color:var(--muted); border:none; padding:7px 16px;
  cursor:pointer; font-size:13px; border-radius:6px; transition:var(--transition); font-weight:500;
}
.mode-tab.active { background:var(--surface); color:var(--accent); box-shadow:var(--shadow-sm); }
.mode-tab:hover:not(.active) { color:var(--text); }

/* ── Layout ── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.layout { display:flex; flex:1; overflow:hidden; }
.chat { flex:1; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; gap:20px; scroll-behavior:smooth; }

/* ── Messages ── */
.msg { max-width:80%; padding:14px 18px; border-radius:var(--radius-lg); line-height:1.65;
  white-space:pre-wrap; word-break:break-word; user-select:text; animation:msgIn .25s ease; position:relative; }
.msg.user { align-self:flex-end; background:var(--msg-user-bg); color:var(--msg-user-text);
  border-bottom-right-radius:4px; box-shadow:var(--shadow); }
.msg.assistant { align-self:flex-start; background:var(--surface); border:1px solid var(--border);
  border-bottom-left-radius:4px; box-shadow:var(--shadow-sm); }
.msg .role { font-size:11px; opacity:0.55; margin-bottom:6px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
.msg .copy-btn { position:absolute; top:8px; right:10px; background:none; border:none; color:var(--muted);
  cursor:pointer; font-size:12px; opacity:0; transition:var(--transition); }
.msg:hover .copy-btn { opacity:.6; }
.msg .copy-btn:hover { opacity:1; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ── Markdown ── */
.msg.assistant pre { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:12px 14px; overflow-x:auto; margin:8px 0; font-size:13px; line-height:1.5; }
.msg.assistant code { background:var(--bg); padding:2px 6px; border-radius:4px; font-size:.9em;
  font-family:'Cascadia Code','Fira Code','Consolas',monospace; }
.msg.assistant pre code { background:none; padding:0; }
.msg.assistant ul, .msg.assistant ol { margin:6px 0; padding-left:22px; }
.msg.assistant blockquote { border-left:3px solid var(--accent); margin:8px 0; padding:4px 12px; opacity:.85; background:var(--accent-light); border-radius:0 4px 4px 0; }

/* ── Input ── */
.input-area { padding:14px 20px; background:var(--header-bg); backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--border); display:flex; gap:10px; align-items:flex-end; }
.input-area textarea { flex:1; background:var(--input-bg); color:var(--text); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 16px; font-size:14px; resize:none; min-height:44px; max-height:160px;
  font-family:inherit; outline:none; transition:var(--transition); box-shadow:var(--shadow-sm); }
.input-area textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
.input-area button { background:var(--accent); color:#fff; border:none; padding:12px 22px; border-radius:var(--radius);
  cursor:pointer; font-size:14px; font-weight:600; white-space:nowrap; transition:var(--transition); box-shadow:var(--shadow); }
.input-area button:hover { background:var(--accent-hover); transform:translateY(-1px); box-shadow:var(--shadow-md); }
.input-area button:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.loading { align-self:flex-start; padding:12px 16px; color:var(--accent); font-size:13px; }
.model-badge { font-size:11px; color:var(--accent); background:var(--accent-light); padding:3px 10px;
  border-radius:20px; font-weight:600; }

/* ── Image / Video Gen ── */
.image-gen { flex:1; display:flex; flex-direction:column; overflow-y:auto; padding:24px 20px; }
.image-gen .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:24px; margin-bottom:16px; box-shadow:var(--shadow); }
.image-gen h2 { font-size:17px; margin-bottom:14px; color:var(--accent); font-weight:700; }
.image-gen textarea { width:100%; background:var(--input-bg); color:var(--text); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px; font-size:14px; resize:vertical; min-height:70px;
  font-family:inherit; outline:none; transition:var(--transition); }
.image-gen textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
.image-gen .meta { font-size:12px; color:var(--muted); margin-top:8px; }
.image-gen .meta span { color:var(--accent); font-weight:600; }
.image-gen img { width:100%; border-radius:var(--radius-lg); margin-top:12px; box-shadow:var(--shadow-md); }
.image-gen .progress { text-align:center; padding:40px 30px; }
.spinner { width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Modal ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px); z-index:9999; display:flex; justify-content:center; align-items:center;
  animation:fadeIn .15s ease; }
.modal-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-xl);
  padding:24px; max-width:520px; width:92%; max-height:72vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.15); }
.modal-box h2 { color:var(--accent); margin-bottom:14px; font-size:18px; font-weight:700; }
.modal-box .model-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0;
  border-bottom:1px solid var(--border); font-size:13px; }
.modal-box .model-row .size { font-size:11px; color:var(--muted); }
.modal-box .model-row button { background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer;
  font-size:11px; padding:4px 10px; font-weight:600; transition:var(--transition); }
.modal-box .model-row button:hover { background:var(--accent-hover); }
.modal-box .model-row button.del { background:#ef4444; }
.modal-box .model-row button.del:hover { background:#dc2626; }
.modal-box .pull-input { display:flex; gap:8px; margin-top:14px; }
.modal-box .pull-input input { flex:1; background:var(--input-bg); color:var(--text); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; outline:none; }
.modal-box .pull-input input:focus { border-color:var(--accent); }
.modal-box .pull-input button { background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm);
  padding:10px 18px; cursor:pointer; font-weight:600; }
.modal-close { float:right; background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted);
  padding:0 4px; transition:var(--transition); }
.modal-close:hover { color:var(--text); }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* ── Claude Button ── */
.hidden { display:none !important; }
.claude-btn { position:fixed; bottom:130px; right:20px; z-index:9999;
  background:linear-gradient(135deg,#818cf8,#6366f1); color:#fff;
  border:none; border-radius:50%; width:48px;height:48px;
  font-size:20px; cursor:grab; box-shadow:0 4px 16px rgba(99,102,241,.35);
  display:flex; align-items:center; justify-content:center; user-select:none; transition:var(--transition); }
.claude-btn:active { cursor:grabbing; transform:scale(.95); }
.claude-btn:hover { transform:scale(1.05); box-shadow:0 6px 24px rgba(99,102,241,.5); }
.claude-btn .tooltip { display:none; position:absolute; right:56px; background:var(--surface);
  color:var(--text); padding:6px 12px; border-radius:var(--radius-sm); font-size:12px;
  white-space:nowrap; border:1px solid var(--border); box-shadow:var(--shadow-md); }
.claude-btn:hover .tooltip { display:block; }
.codex-btn { position:fixed; bottom:130px; right:76px; z-index:9999;
  background:linear-gradient(135deg,#10b981,#059669); color:#fff;
  border:none; border-radius:50%; width:44px;height:44px;
  font-size:18px; cursor:pointer; box-shadow:0 4px 16px rgba(16,185,129,.35);
  display:flex; align-items:center; justify-content:center; user-select:none; transition:var(--transition); }
.codex-btn:hover { transform:scale(1.05); box-shadow:0 6px 24px rgba(16,185,129,.5); }
.codex-btn .tooltip { display:none; position:absolute; right:52px; background:var(--surface);
  color:var(--text); padding:6px 12px; border-radius:var(--radius-sm); font-size:12px;
  white-space:nowrap; border:1px solid var(--border); box-shadow:var(--shadow-md); }
.codex-btn:hover .tooltip { display:block; }

/* ── Sidebar ── */
.sidebar { width:270px; background:var(--sidebar-bg); border-right:1px solid var(--border);
  display:flex; flex-direction:column; transition:margin-left .25s cubic-bezier(.4,0,.2,1); overflow:hidden; flex-shrink:0; }
.sidebar.collapsed { margin-left:-270px; width:0; }
.sidebar-header { padding:14px; display:flex; gap:8px; border-bottom:1px solid var(--border); }
.sidebar-header button { flex:1; padding:8px 12px; border:none; border-radius:var(--radius-sm); cursor:pointer;
  font-size:12px; font-weight:600; transition:var(--transition); }
.sidebar-header .btn-new { background:var(--accent); color:#fff; }
.sidebar-header .btn-new:hover { background:var(--accent-hover); }
.sidebar-list { flex:1; overflow-y:auto; padding:6px; }
.sidebar-item { padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; margin:2px 0; font-size:13px;
  border:1px solid transparent; transition:var(--transition); display:flex; justify-content:space-between; align-items:center; }
.sidebar-item:hover { background:var(--surface); border-color:var(--border); }
.sidebar-item.active { background:var(--surface); border-color:var(--accent); box-shadow:var(--shadow-sm); }
.sidebar-item .del { opacity:0; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 6px; transition:var(--transition); }
.sidebar-item:hover .del { opacity:.5; }
.sidebar-item .del:hover { opacity:1; color:#ef4444; }
.sidebar-toggle { position:absolute; left:270px; top:50%; z-index:10; background:var(--surface);
  border:1px solid var(--border); border-left:none; border-radius:0 6px 6px 0; cursor:pointer;
  padding:10px 5px; font-size:11px; box-shadow:var(--shadow-sm); transition:var(--transition); }

/* ── Token Bar ── */
.token-bar { height:2px; background:var(--border); position:relative; flex-shrink:0; }
.token-bar-inner { height:100%; transition:width .5s,background .5s; border-radius:0 2px 2px 0; }
.token-bar-inner.low { background:var(--accent); }
.token-bar-inner.medium { background:#f59e0b; }
.token-bar-inner.high { background:#ef4444; }
.token-toast { position:fixed; bottom:190px; left:50%; transform:translateX(-50%); z-index:10000;
  padding:12px 20px; border-radius:var(--radius); font-size:13px; font-weight:600;
  box-shadow:0 12px 40px rgba(0,0,0,.2); animation:toastIn .4s ease; max-width:90vw;
  display:flex; align-items:center; gap:10px; cursor:pointer; }
.token-toast.warn { background:#fffbeb; color:#92400e; border:1px solid #fcd34d; }
.token-toast.danger { background:#fef2f2; color:#991b1b; border:1px solid #fca5a5; }
.token-toast.info { background:#eff6ff; color:#1e40af; border:1px solid #93c5fd; }
.token-toast .bar-wrap { flex:1; height:4px; background:rgba(0,0,0,.08); border-radius:2px; overflow:hidden; min-width:60px; }
.token-toast .bar-fill { height:100%; border-radius:2px; transition:width .3s; }
.token-toast.warn .bar-fill { background:#f59e0b; }
.token-toast.danger .bar-fill { background:#ef4444; }
.token-toast.info .bar-fill { background:#3b82f6; }
.token-toast .close-toast { background:none; border:none; cursor:pointer; font-size:16px; opacity:.4; }
.token-toast .close-toast:hover { opacity:1; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* ── Agent Layout ── */
.agent-layout { display:flex; flex:1; overflow:hidden; }
.agent-main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.agent-main .agent-log-wrap { flex:1; overflow-y:auto; padding:20px 24px; }

/* ── Tools Panel (Raycast-style) ── */
.tools-panel { width:310px; background:var(--sidebar-bg); border-right:1px solid var(--border);
  display:flex; flex-direction:column; flex-shrink:0; transition:margin-left .25s cubic-bezier(.4,0,.2,1); }
.tools-panel.collapsed { margin-left:-310px; width:0; }
.tools-panel-header { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; }
.tools-panel-header .count { font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-light);
  padding:2px 8px; border-radius:10px; white-space:nowrap; }
.tools-search { flex:1; background:var(--input-bg); color:var(--text); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:6px 10px; font-size:12px; outline:none; transition:var(--transition); }
.tools-search:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-light); }
.tools-categories { padding:8px 10px; border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; gap:4px; }
.tools-cat { background:var(--surface); border:1px solid var(--border); color:var(--muted); padding:4px 10px;
  border-radius:14px; cursor:pointer; font-size:11px; transition:var(--transition); white-space:nowrap; font-weight:500; }
.tools-cat:hover { border-color:var(--accent); color:var(--accent); }
.tools-cat.active { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:var(--shadow-sm); }
.tools-list { flex:1; overflow-y:auto; padding:6px; }
.tool-item { padding:8px 12px; border-radius:var(--radius-sm); cursor:pointer; margin:2px 0; font-size:12px;
  border:1px solid transparent; transition:var(--transition); display:flex; justify-content:space-between; align-items:center; }
.tool-item:hover { background:var(--surface); border-color:var(--border); }
.tool-item.selected { background:var(--accent-light); border-color:var(--accent); }
.tool-item .tool-name { font-weight:600; color:var(--accent); font-size:12px; }
.tool-item .tool-desc { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
.tool-detail { padding:14px; border-top:1px solid var(--border); background:var(--surface); max-height:280px; overflow-y:auto; display:none; }
.tool-detail.show { display:block; animation:slideUp .2s ease; }
.tool-detail h4 { color:var(--accent); margin-bottom:4px; font-size:14px; font-weight:700; }
.tool-detail .param-row { font-size:11px; padding:3px 0; color:var(--muted); display:flex; gap:8px; align-items:baseline; }
.tool-detail .param-row .pn { font-weight:600; color:var(--text); min-width:85px; font-family:monospace; font-size:11px; }
.tool-detail .param-row .pt { color:var(--accent); font-size:10px; background:var(--accent-light); padding:1px 5px; border-radius:3px; }
.tool-detail .param-row .pd { flex:1; }
.tool-detail .try-btn { margin-top:10px; background:var(--accent); color:#fff; border:none; padding:7px 16px;
  border-radius:var(--radius-sm); cursor:pointer; font-size:12px; font-weight:600; transition:var(--transition); }
.tool-detail .try-btn:hover { background:var(--accent-hover); }
.tool-exec-result { margin-top:8px; padding:10px; border-radius:var(--radius-sm); font-size:11px;
  font-family:'Cascadia Code','Fira Code',Consolas,monospace; max-height:130px; overflow-y:auto;
  background:var(--bg); white-space:pre-wrap; display:none; }
.tool-exec-result.show { display:block; }
.tool-exec-result.ok { border-left:3px solid #10b981; }
.tool-exec-result.err { border-left:3px solid #ef4444; }
.tools-toggle { background:var(--accent); color:#fff; border:none; padding:6px 10px; border-radius:var(--radius-sm);
  cursor:pointer; font-size:14px; transition:var(--transition); }
.tools-toggle:hover { background:var(--accent-hover); }
@keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ── Scrollbar ── */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--subtle); }

/* ── Persona Selector ── */
.persona-select { background:var(--accent-light); color:var(--accent); border:1px solid var(--accent);
  padding:4px 8px; border-radius:14px; font-size:11px; cursor:pointer; font-weight:600; flex-shrink:0; max-width:120px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:var(--transition); }
.persona-select:hover { background:var(--accent); color:#fff; }
.persona-select.none { background:var(--input-bg); color:var(--muted); border-color:var(--border); }
.persona-option { display:flex; justify-content:space-between; align-items:center; padding:8px 14px; cursor:pointer;
  font-size:12px; border-bottom:1px solid var(--border); transition:var(--transition); }
.persona-option:hover { background:var(--accent-light); }
.persona-option .del-persona { color:var(--muted); cursor:pointer; font-size:14px; padding:2px 6px; }
.persona-option .del-persona:hover { color:#ef4444; }

/* ── Selection ── */
::selection { background:var(--accent-light); color:var(--accent); }

/* ── Command Palette (Ctrl+K) ── */
.cmd-palette-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px); z-index:99999; display:flex; justify-content:center; padding-top:15vh;
  animation:fadeIn .15s ease; }
.cmd-palette { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  width:560px; max-width:92vw; box-shadow:0 20px 60px rgba(0,0,0,.2); overflow:hidden; }
.cmd-palette input { width:100%; background:var(--surface); color:var(--text); border:none; border-bottom:1px solid var(--border);

<script>
const OLLAMA = 'http://localhost:11434';
const GEN_API = window.location.origin;
const ORCH_API = window.location.protocol + '//' + window.location.hostname + ':5001';
let model = 'deepseek-r1:14b';
let chatModel = 'ollama';
let currentMode = 'chat';
let genPolling = null;

// ═══════ Token 用量追踪 ═══════
const MODEL_LIMITS = {
  'deepseek-r1:14b': 32768, 'qwen3:8b': 8192, 'lingmo-uncensored:latest': 8192,
  'lingmo-writer:latest': 8192, 'huihui_ai/qwen3-abliterated:8b': 8192,
  'claude': 200000, 'claude-sonnet': 200000, 'claude-haiku': 200000,
  'gpt': 128000, 'gpt-mini': 128000, 'gemini': 1048576, 'gemini-fast': 1048576,
  'deepseek': 1000000, 'deepseek-v4-pro': 1000000,
  'ollama': 32768, 'openrouter': 200000
};
let messageLog = [];  // [{role, content, tokens}]
let currentToast = null;
let tokenWarningDismissed = {warn: false, danger: false};

function estimateTokens(text) {
  if (!text) return 0;
  let cn = (text.match(/[一-鿿　-〿＀-￯]/g) || []).length;
  let en = text.length - cn;
  return Math.ceil(cn / 1.5 + en / 4);
}

function getContextLimit() {
  if (chatModel === 'openrouter') {
    let sub = document.getElementById('orSubModel').value;
    return MODEL_LIMITS[sub] || 200000;
  }
  return MODEL_LIMITS[model] || 8192;
}

function totalTokens() {
  return messageLog.reduce((s, m) => s + m.tokens, 0);
}

function updateTokenBar() {
  let used = totalTokens();
  let limit = getContextLimit();
  let pct = Math.min(100, Math.round(used / limit * 100));
  let inner = document.getElementById('tokenBarInner');
  inner.style.width = pct + '%';
  inner.className = 'token-bar-inner ' + (pct > 85 ? 'high' : pct > 60 ? 'medium' : 'low');
  document.getElementById('status').textContent = `ctx: ${Math.round(used/1000)}k/${Math.round(limit/1000)}k (${pct}%)`;
}

function showTokenToast(msg, type) {
  if (currentToast) currentToast.remove();
  if (type === 'warn' && tokenWarningDismissed.warn) return;
  if (type === 'danger' && tokenWarningDismissed.danger) return;
  let toast = document.createElement('div');
  toast.className = 'token-toast ' + type;
  let limit = getContextLimit();
  let pct = Math.round(totalTokens() / limit * 100);
  toast.innerHTML = `<span>${msg} (${pct}%)</span>
    <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div>
    <button class="close-toast" onclick="dismissToast('${type}',this.parentElement)">×</button>`;
  document.body.appendChild(toast);
  currentToast = toast;
  if (type !== 'danger') setTimeout(() => { if (currentToast === toast) toast.remove(); currentToast = null; }, 5000);
}

function dismissToast(type, el) {
  if (type === 'warn') tokenWarningDismissed.warn = true;
  if (type === 'danger') tokenWarningDismissed.danger = true;
  el.remove(); currentToast = null;
}

function checkTokenLimit() {
  let used = totalTokens();
  let limit = getContextLimit();
  let pct = Math.round(used / limit * 100);
  updateTokenBar();
  if (pct >= 95 && !tokenWarningDismissed.danger) {
    showTokenToast('⚠️ 上下文即将溢出！请发送 /clear 或切换新会话', 'danger');
  } else if (pct >= 80 && pct < 95 && !tokenWarningDismissed.warn) {
    showTokenToast('⚡ 上下文用量较高，建议精简对话或切换模型', 'warn');
  } else if (pct >= 50 && pct < 80 && !currentToast) {
    showTokenToast('📊 上下文用量过半，注意后续回复质量可能下降', 'info');
  }
}

function logMessage(role, content) {
  let tokens = estimateTokens(content);
  messageLog.push({role, content, tokens, time: Date.now()});
  checkTokenLimit();
}

// ═══════ Persona System ═══════
const DEFAULT_PERSONAS = {
  "friend": {
    name: "毒舌闺蜜",
    prompt: `你是我的好朋友，模仿我的闺蜜/死党跟我聊天。严格遵守以下风格：

## 说话方式
- 极短句，通常2-8个字，不超过20字。能打一个字绝不打两个。
- 用"呀""哟""哦""吧""嘛"结尾。"行吧""知道啊""不能呀宝子"
- 微信式语言：单独的"？""？"就是质问，"✌️""行""好！"就是表态
- 常用口语词：我靠、笑死、确实、哦哦、可以可以、不是
- 偶尔毒舌，但不真生气。"你要死吧""滚""你有审美吗"是亲昵不是骂人
- 经常用反问和吐槽来表达关心

## 对我的称呼
- 多数时候叫"宝子"，偶尔不提称呼直接说话

## 表情包/颜文字
- 大量使用 [偷笑][捂脸][流泪][调皮][害羞] ——模仿微信自带表情
- ✌️、？、！作为独立消息发送

## 回复节奏
- 想到什么说什么，话题跳跃快
- 没话说就发表情包或"哦哦""行"
- 不想继续话题就直接"？"或换个话题

## 兴趣爱好
- 打游戏（瓦罗兰特/Valorant叫"瓦"），刷抖音
- 体育课、同学、学校日常
- 喜欢自称好看，会吐槽别人颜值

## 重要
- 不要长篇大论，回复永远小于20字
- 不要用"亲爱的""你好呀"等客套话，直接开聊
- 语气像认识多年的损友，不是礼貌的陌生人
- 不懂装懂，瞎聊也行`
  }
};

let personas = {};
let activePersona = "";
let currentSystemPrompt = "";

function loadPersonas() {
  try {
    personas = JSON.parse(localStorage.getItem('ai_suite_personas') || '{}');
  } catch(e) { personas = {}; }
  // Merge defaults if not present
  for (let k in DEFAULT_PERSONAS) {
    if (!personas[k]) personas[k] = DEFAULT_PERSONAS[k];
  }
  savePersonas();
  refreshPersonaSelect();
}

function savePersonas() {
  localStorage.setItem('ai_suite_personas', JSON.stringify(personas));
}

function refreshPersonaSelect() {
  let sel = document.getElementById('personaSelect');
  sel.innerHTML = '<option value="">无角色</option>';
  for (let k in personas) {
    sel.innerHTML += `<option value="${k}" ${k===activePersona?'selected':''}>${personas[k].name}</option>`;
  }
  sel.className = activePersona ? 'persona-select' : 'persona-select none';
}

function switchPersona() {
  let key = document.getElementById('personaSelect').value;
  activePersona = key;
  currentSystemPrompt = key ? (personas[key]?.prompt || '') : '';
  refreshPersonaSelect();
  if (key) {
    addMsg('system', '🎭 角色: ' + personas[key].name);
  } else {
    addMsg('system', '🎭 已取消角色，恢复默认');
  }
}

function savePersona() {
  let key = prompt('角色 ID（英文，如 friend/coworker）:');
  if (!key) return;
  let name = prompt('角色名称:');
  if (!name) return;
  let prompt = prompt('系统提示词（粘贴完整内容）:', currentSystemPrompt || '');
  if (!prompt) return;
  personas[key] = {name, prompt};
  savePersonas();
  activePersona = key;
  currentSystemPrompt = prompt;
  refreshPersonaSelect();
  addMsg('system', '💾 已保存角色: ' + name);
}

// Load personas on startup
loadPersonas();

function clearTokenState() {
  messageLog = [];
  tokenWarningDismissed = {warn: false, danger: false};
  if (currentToast) { currentToast.remove(); currentToast = null; }
  updateTokenBar();
}

// ═══════ /commands ═══════
function handleSlashCommand(text) {
  let cmd = text.trim();
  if (cmd === '/clear' || cmd === '/reset') {
    document.getElementById('chatView').innerHTML = '';
    clearTokenState();
    addMsg('system', '会话已重置，上下文已清空');
    return true;
  }
  if (cmd === '/stats' || cmd === '/tokens') {
    let used = totalTokens();
    let limit = getContextLimit();
    addMsg('system', `📊 Token: ${Math.round(used/1000)}k / ${Math.round(limit/1000)}k (${Math.round(used/limit*100)}%)\n📝 消息数: ${messageLog.length}\n💾 模型: ${chatModel === 'ollama' ? model : document.getElementById('orSubModel').value}`);
    return true;
  }
  if (cmd === '/compress') {
    // 保留 system + 最后 5 条消息
    let kept = [];
    let sysCount = 0;
    for (let m of messageLog) {
      if (m.role === 'system') { kept.push(m); sysCount++; }
    }
    let recent = messageLog.filter(m => m.role !== 'system').slice(-5);
    messageLog = [...kept, ...recent];
    updateTokenBar();
    addMsg('system', `🗜️ 已压缩：保留 ${kept.length} 条系统消息 + ${recent.length} 条最近对话 (${Math.round(totalTokens()/1000)}k tokens)`);
    return true;
  }
  return false;
}

function switchMode(mode) {

  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);

  const chatInput = document.getElementById('chatInputArea');
  chatInput.classList.toggle('hidden', mode !== 'chat');

  const modelRow = document.getElementById('orchestratorModel');
  if (modelRow) modelRow.style.display = (mode === 'chat') ? '' : 'none';
  document.getElementById('modelSelect').style.display = (mode === 'chat' && chatModel === 'ollama') ? '' : 'none';
  document.getElementById('orSubModel').style.display = (mode === 'chat' && chatModel === 'openrouter') ? '' : 'none';

  if (activeView) { setTimeout(() => { activeView.scrollTop = activeView.scrollHeight; }, 100); }

  {key:'file', icon:'📁', label:'文件'},
  {key:'shell', icon:'💻', label:'Shell'},
  {key:'web', icon:'🌐', label:'网页'},

function _toolCat(name) {
  if (/^(read_file|write_file|list_dir|find_files|copy_file|move_file|delete_file)$/.test(name)) return 'file';
  if (/^(shell|run_python)$/.test(name)) return 'shell';
  if (/^(web_fetch|web_search|open_browser)$/.test(name)) return 'web';
  if (/^(click|move_mouse|mouse_pos|type_text|press_key|get_windows|focus_window|window_control|screenshot|launch_app|ocr)$/.test(name)) return 'desktop';
  if (/^video_/.test(name)) return 'video';
  if (/^(create_pptx|create_dxf)$/.test(name)) return 'document';
  if (/^(system_info|list_processes|kill_process|get_volume|set_volume)$/.test(name)) return 'system';
  if (/^clipboard_/.test(name)) return 'clipboard';
  return 'other';
}

async function loadTools() {
  if (allTools.length) { renderTools(); return; }
  try {
    const r = await fetch(ORCH_API + '/api/tools');

    allTools = (data.tools || []).map(t => ({...t, category: _toolCat(t.name)}));
    renderToolCategories();
    renderTools();
  } catch(e) {
    document.getElementById('toolsList').innerHTML = '<div style="padding:12px;color:var(--muted);font-size:12px">❌ 编排器未连接 (5001)</div>';

function renderToolCategories() {
  const cats = TOOL_CATEGORIES.filter(c => c.key === 'all' || allTools.some(t => t.category === c.key));
  document.getElementById('toolsCategories').innerHTML = cats.map(c =>
    `<span class="tools-cat${activeToolCat===c.key?' active':''}" onclick="setToolCat('${c.key}')">${c.icon} ${c.label}</span>`

function renderTools() {
  const q = (document.getElementById('toolsSearch')?.value || '').toLowerCase();
  let filtered = allTools;
  if (activeToolCat !== 'all') filtered = filtered.filter(t => t.category === activeToolCat);
  if (q) filtered = filtered.filter(t => t.name.includes(q) || (t.description||'').toLowerCase().includes(q));
  document.getElementById('toolsList').innerHTML = filtered.length
    ? filtered.map(t =>
      `<div class="tool-item${selectedTool===t.name?' selected':''}" onclick="selectTool('${t.name}')" title="${(t.description||'').replace(/"/g,'&quot;')}">
        <div style="overflow:hidden;flex:1">

          <div class="tool-desc">${t.description||''}</div>
        </div>
        <span style="font-size:10px;opacity:.5">${TOOL_CATEGORIES.find(c=>c.key===t.category)?.icon||'🔧'}</span>
      </div>`
    ).join('')
    : '<div style="padding:12px;color:var(--muted);font-size:12px;text-align:center">未找到工具</div>';

function selectTool(name) {
  selectedTool = name;
  const t = allTools.find(t => t.name === name);
  if (!t) return;
  renderTools();
  document.getElementById('toolDetailName').textContent = t.name;
  document.getElementById('toolDetailDesc').textContent = t.description || '';
  const schema = t.schema || {};
  const params = Object.entries(schema);
  document.getElementById('toolDetailParams').innerHTML = params.length
    ? params.map(([k,v]) => {
        const opt = v.optional ? ' <span style="color:var(--muted);font-size:10px">(可选)</span>' : '';
        return `<div class="param-row"><span class="pn">${k}</span><span class="pt">${v.type||'string'}</span><span class="pd">${v.description||''}${opt}</span></div>`;
      }).join('')
    : '<div style="font-size:11px;color:var(--muted)">无参数</div>';

  let execHtml = '';
  if (params.length <= 6) {
    execHtml = params.map(([k,v]) => {
      const isNum = v.type === 'integer' || v.type === 'number';
      return `<input id="toolParam_${k}" placeholder="${k}${v.optional?' (可选)':''}" style="width:100%;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:11px;margin:2px 0" type="${isNum?'number':'text'}">`;
    }).join('');
    execHtml += `<button class="try-btn" onclick="executeTool('${name}')">▶ 手动执行</button>`;
  } else {
    execHtml = '<div style="font-size:11px;color:var(--muted)">参数较多，请通过 Agent 调用</div>';
  }
  document.getElementById('toolDetailExec').innerHTML = execHtml;
  document.getElementById('toolDetail').classList.add('show');
  document.getElementById('toolExecResult').classList.remove('show');
}

async function executeTool(name) {
  const t = allTools.find(t => t.name === name);
  if (!t) return;
  const schema = t.schema || {};
  const params = {};
  Object.entries(schema).forEach(([k,v]) => {
    const el = document.getElementById('toolParam_' + k);
    if (el && el.value.trim()) {
      params[k] = v.type === 'integer' ? parseInt(el.value) : v.type === 'number' ? parseFloat(el.value) : el.value.trim();
    }
  });
  const resultEl = document.getElementById('toolExecResult');
  resultEl.textContent = '⏳ 执行中...';
  resultEl.className = 'tool-exec-result show';
  try {
    const r = await fetch(ORCH_API + '/api/tools/' + name, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(params)
    });
    const data = await r.json();
    resultEl.textContent = JSON.stringify(data, null, 2);
    resultEl.className = 'tool-exec-result show ' + (data.ok ? 'ok' : 'err');
  } catch(e) {
    resultEl.textContent = '执行失败: ' + e.message;
    resultEl.className = 'tool-exec-result show err';
  }
}

  }

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('sendBtn');
  let text = input.value.trim();
  if (text.startsWith('/') && handleSlashCommand(text)) {
    input.value = ''; input.style.height = 'auto'; return;
  }
  if (uploadedText.chat) {
    text = text + '\n\n[上传文档内容]\n' + uploadedText.chat;
  }
  if (!text) return;

  input.value = ''; input.style.height = 'auto';
  btn.disabled = true;

  addMsg('user', text);
  const chat = document.getElementById('chatView');

  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg assistant';
  msgDiv.innerHTML = '<div class="role">g0dness</div><span class="stream-cursor">▌</span>';
  chat.appendChild(msgDiv);

  let fullReply = '';
  let modelName = chatModel === 'ollama' ? 'g0dness' : '';

  try {
    const orSub = document.getElementById('orSubModel').value;
    const forceModel = chatModel === 'ollama' ? ('ollama:' + model) : orSub;
    const resp = await fetch(ORCH_API + '/api/chat/stream', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt: text, model: forceModel, system: currentSystemPrompt})
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') break;
        try {
          const d = JSON.parse(data);
          if (d.error) {
            fullReply = '错误: ' + d.error;
            msgDiv.innerHTML = '<div class="role">错误</div>' + fullReply;
            break;
          }
          if (d.model && !modelName) modelName = d.model;
          if (d.token) {
            fullReply += d.token;
            msgDiv.innerHTML = '<div class="role">' + (modelName || 'g0dness') + '</div>'
              + fullReply.replace(/</g,'&lt;') + '<span class="stream-cursor">▌</span>';
            chat.scrollTop = chat.scrollHeight;
          }
        } catch(e) {}
      }
    }
    // Remove cursor, add copy button
    const role = modelName && modelName !== 'ollama' ? modelName : 'g0dness';
    msgDiv.innerHTML = '<div class="role">' + role + '</div>'
      + renderMD(fullReply)
      + ' <button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.textContent.replace(/^'+role+'/,\'\').trim())">📋</button>';
    document.getElementById('status').textContent = '就绪';
    // Log + persist assistant reply
    if (fullReply) {
      logMessage('assistant', fullReply);
      saveMsg('assistant', fullReply, estimateTokens(fullReply));
    }
  } catch(e) {
    msgDiv.innerHTML = '<div class="role">错误</div>无法连接服务。请确认:<br>1. Ollama 在运行 (11434)<br>2. 编排器在运行 (5001)<br>3. 访问地址是 http://localhost:5000/chat<br><br>错误: '+e.message;
    document.getElementById('status').textContent = '离线';
  }

  chat.scrollTop = chat.scrollHeight;
  btn.disabled = false;
  input.focus();
}

function pollGenResult() {
  if (genPolling) clearInterval(genPolling);
  genPolling = setInterval(async () => {
    try {
      const r = await fetch(GEN_API + '/api/status');
      const s = await r.json();
      const area = document.getElementById('genResult');
      let html = '';

      if (s.status === 'enhancing') {
        html = '<div class="progress"><div class="spinner"></div><p>💬 Ollama 增强提示词...</p></div>';
      } else if (s.status === 'switching') {
        html = '<div class="progress"><div class="spinner"></div><p>🔄 切换到 ComfyUI...</p></div>';
      } else if (s.status === 'generating') {
        html = '<div class="progress"><div class="spinner"></div><p>🎨 SDXL 生成中...</p></div>';
        if (s.positive) html += '<div class="card"><p style="color:#a78bfa;font-size:13px">正向: '+s.positive+'</p></div>';
        if (s.negative) html += '<div class="card"><p style="color:#666;font-size:13px">负向: '+s.negative+'</p></div>';
      } else if (s.status === 'done') {
        clearInterval(genPolling);
        document.getElementById('genBtn').disabled = false;
        document.getElementById('genBtn').textContent = '生成';
        html = '<div class="card"><h2 style="color:#10b981">✅ 生成完成</h2>';
        if (s.positive) html += '<p style="color:#a78bfa;font-size:13px">正向: '+s.positive+'</p>';
        if (s.seed) html += '<p style="color:#666;font-size:11px">Seed: '+s.seed+'</p>';
        if (s.image) html += '<img src="'+s.image+'" alt="生成结果" style="width:100%;border-radius:12px;margin-top:8px">';
        html += '<button class="mode-tab active" style="margin-top:12px;width:100%;padding:10px;font-size:14px;border-radius:8px;" onclick="switchToOllama()">🔄 切回对话模式</button>';
        html += '</div>';
      } else if (s.status === 'error') {
        clearInterval(genPolling);
        document.getElementById('genBtn').disabled = false;
        document.getElementById('genBtn').textContent = '生成';
        html = '<div class="card" style="color:#ef4444">❌ '+s.message+'</div>';
      }

      area.innerHTML = html;
    } catch(e) {}
  }, 1500);
}

async function uploadFile(type) {

  var formData = new FormData();

  var previewEl = document.getElementById(previewId);

    previewEl.style.display = 'flex';

    var r = await fetch(GEN_API + '/api/upload', { method: 'POST', body: formData });
    var d = await r.json();
    if (d.ok) {
      uploadedUrls[type] = d.url;
      var isImg = file.type.startsWith('image/') || d.url.match(/\.(png|jpg|jpeg|gif|webp)/i);
      var closeBtn = '<button onclick="clearUpload(\''+type+'\')" style="color:#ef4444;background:none;border:none;cursor:pointer;font-size:18px">&times;</button>';

      } else {
        previewEl.innerHTML = (isImg

          : '<video src="'+d.url+'" controls style="max-height:80px;border-radius:6px"></video>'

// ═══════ 拖拽按钮 (Claude + Codex) ═══════
(function(){
  function makeDraggable(btn, apiUrl) {
    var dragging = false, offX = 0, offY = 0, startX = 0, startY = 0;
    btn.addEventListener('mousedown', function(e){
      if (e.button !== 0) return;
      dragging = true;
      var rect = btn.getBoundingClientRect();
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      startX = e.clientX;
      startY = e.clientY;
      btn.style.transition = "none";
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e){
      if (!dragging) return;
      btn.style.left = (e.clientX - offX) + 'px';
      btn.style.top = (e.clientY - offY) + 'px';
      btn.style.right = 'auto';
      btn.style.bottom = 'auto';
    });
    document.addEventListener('mouseup', function(e){
      if (!dragging) return;
      dragging = false;
      btn.style.transition = '';
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) < 5 && Math.abs(dy) < 5) {
        fetch(GEN_API + apiUrl);
      }
    });
  }
  makeDraggable(document.getElementById('claudeBtn'), '/api/open_claude');
  makeDraggable(document.getElementById('codexBtn'), '/api/open_codex');
})();

function showCommandPalette() {
  const overlay = document.createElement('div');
  overlay.className = 'cmd-palette-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  // Build commands
  const commands = [
    {icon:'💬', title:'对话模式', desc:'切换到对话标签', shortcut:'Ctrl+1', action(){switchMode('chat')}},
    {icon:'🎨', title:'生图模式', desc:'切换到生图标签', shortcut:'Ctrl+2', action(){switchMode('image')}},
    {icon:'🎬', title:'生视频模式', desc:'切换到生视频标签', shortcut:'Ctrl+3', action(){switchMode('video')}},
    {icon:'🤖', title:'Agent 模式', desc:'切换到 Agent 标签', shortcut:'Ctrl+4', action(){switchMode('agent')}},
    {icon:'📝', title:'新建会话', desc:'开始一段新对话', shortcut:'Ctrl+N', action(){newConversation()}},
    {icon:'📥', title:'导出对话', desc:'导出当前对话为 Markdown', action(){exportConversation()}},
    {icon:'📊', title:'仪表盘', desc:'查看用量和系统状态', action(){showDashboard()}},
    {icon:'⏰', title:'定时任务', desc:'管理定时调度', action(){showSchedulerUI()}},
    {icon:'📦', title:'模型管理', desc:'管理 Ollama 模型', action(){showModelManager()}},
    {icon:'📱', title:'手机扫码', desc:'生成 LAN 遥控二维码', action(){showQR()}},
    {icon:'🧠', title:'启动 Claude Code', desc:'打开 Claude Code CLI', action(){fetch(GEN_API+'/api/open_claude')}},
    {icon:'⚡', title:'启动 Codex', desc:'打开 Codex CLI', action(){fetch(GEN_API+'/api/open_codex')}},
    {icon:'🎤', title:'语音输入', desc:'开始语音输入', action(){toggleVoice()}},
    {icon:'🔄', title:'刷新页面', desc:'强制刷新 (防缓存)', action(){location.replace(location.pathname+'?t='+Date.now())}},
  ];

  // Add tool commands if tools loaded
  if (allTools.length) {
    allTools.forEach(t => {
      commands.push({
        icon:'🔧', title:t.name, desc:t.description||'', shortcut:t.category||'',
        action(){ switchMode('agent'); setTimeout(()=>selectTool(t.name),500); overlay.remove(); }
      });
    });
  }

  let filtered = commands;
  const palette = document.createElement('div');
  palette.className = 'cmd-palette';
  palette.innerHTML = `<input placeholder="输入命令或搜索工具..." autofocus oninput="window._cmdFilter(this.value)">`;
  const results = document.createElement('div');
  results.className = 'cmd-results';
  palette.appendChild(results);
  overlay.appendChild(palette);
  document.body.appendChild(overlay);

  let activeIdx = 0;
  window._cmdFilter = function(q) {
    filtered = commands.filter(c =>
      c.title.toLowerCase().includes(q.toLowerCase()) ||
      (c.desc||'').toLowerCase().includes(q.toLowerCase())
    );
    activeIdx = 0;
    renderCmdResults();
  };

  function renderCmdResults() {
    results.innerHTML = filtered.slice(0, 30).map((c,i) =>
      `<div class="cmd-item${i===activeIdx?' active':''}" onclick="this.closest('.cmd-palette-overlay').remove();(${c.action.toString()})()">
        <span class="cmd-icon">${c.icon}</span>
        <div style="flex:1;overflow:hidden">
          <div class="cmd-title">${c.title}</div>
          ${c.desc?`<div class="cmd-desc">${c.desc}</div>`:''}
        </div>
        ${c.shortcut?`<span class="cmd-shortcut">${c.shortcut}</span>`:''}
      </div>`
    ).join('');
  }

  // Keyboard nav
  palette.querySelector('input').addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx+1, filtered.length-1); renderCmdResults(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); renderCmdResults(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (filtered[activeIdx]) {
        overlay.remove();
        filtered[activeIdx].action();
      }
    }
    else if (e.key === 'Escape') { overlay.remove(); }
  });

  renderCmdResults();
}

// ═══════ Markdown 渲染 ═══════
function renderMD(text) {
  if (!text) return '';
  let t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // code blocks ``` — placeholder to protect from <br>
  let blocks = [];
  t = t.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
    blocks.push('<pre><code>' + code.trim() + '</code></pre>');
    return '%%BLOCK_' + (blocks.length-1) + '%%';
  });
  // inline code `
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold **
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  // italic *
  t = t.replace(/\*(.+?)\*/g, '<i>$1</i>');
  // headers
  t = t.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  t = t.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  // unordered list
  t = t.replace(/^- (.+)$/gm, '<li>$1</li>');
  // blockquote
  t = t.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // links
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // newlines (after blocks protected)
  t = t.replace(/\n/g, '<br>');
  // restore code blocks
  t = t.replace(/%%BLOCK_(\d+)%%/g, function(_, i) { return blocks[parseInt(i)]; });
  return t;
}

  btn.disabled = true; btn.textContent = '⏳';
  const log = document.getElementById('agentLog');

  // 添加任务卡片
  const taskDiv = document.createElement('div');
  taskDiv.className = 'msg user';
  taskDiv.innerHTML = '<div class="role">📋 任务</div>' + task;
  log.appendChild(taskDiv);

  const streamDiv = document.createElement('div');
  streamDiv.className = 'msg assistant';
  streamDiv.innerHTML = '<div class="role">🤖 Agent 工作中...</div>';
  log.appendChild(streamDiv);

  let agentModel = document.getElementById('agentModel').value;
  let fullText = '';
  let toolCalls = [];
  let turns = 0;

  try {
    const resp = await fetch(ORCH_API + '/api/agent/stream', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({task: task, model: agentModel})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const evt = JSON.parse(line.slice(6));
          if (evt.type === 'turn') {
            // New turn started
          } else if (evt.type === 'token') {
            // Streaming token from Ollama
            fullText += evt.token;
            let html = '<div class="role">🤖 ' + (agentModel||'Agent') + ' · 思考中 · 第' + (evt.turn+1) + '轮</div>';
            html += '<div style="color:var(--muted);font-size:12px;margin:4px 0;border-left:3px solid var(--accent);padding-left:8px">' + escapeHTML(fullText.slice(-1500)) + '<span class="stream-cursor">▌</span></div>';
            if (toolCalls.length) {
              html += toolCalls.map(tc => '<div style="background:rgba(0,0,0,.05);padding:4px 8px;border-radius:4px;margin:2px 0;font-size:12px">🔧 <b>' + tc.name + '</b>' + (tc.result ? (' → ' + (tc.result.ok ? '✅' : '❌')) : ' ⏳') + '</div>').join('');
            }
            streamDiv.innerHTML = html;
            log.scrollTop = log.scrollHeight;
          } else if (evt.type === 'thinking') {
            fullText += evt.text;
            let html = '<div class="role">🤖 ' + (agentModel||'Agent') + ' · 思考中 · 第' + ((evt.turn||0)+1) + '轮</div>';
            html += '<div style="color:var(--muted);font-size:12px;margin:4px 0;border-left:3px solid var(--accent);padding-left:8px">' + escapeHTML(fullText.slice(-1500)) + '</div>';
            if (toolCalls.length) {
              html += toolCalls.map(tc => '<div style="background:rgba(0,0,0,.05);padding:4px 8px;border-radius:4px;margin:2px 0;font-size:12px">🔧 <b>' + tc.name + '</b>' + (tc.result ? (' → ' + (tc.result.ok ? '✅' : '❌')) : ' ⏳') + '</div>').join('');
            }
            streamDiv.innerHTML = html;
            log.scrollTop = log.scrollHeight;
          } else if (evt.type === 'goal_check') {
            fullText += '\n\n_(' + (evt.msg || '目标检测') + ')_';
          } else if (evt.type === 'tool_call') {
            toolCalls.push({name: evt.tool, args: JSON.stringify(evt.args||{}).slice(0, 80), result: null});
            let html = '<div class="role">🤖 ' + (agentModel||'Agent') + ' · 执行工具</div>';
            html += toolCalls.map(tc => '<div style="background:rgba(0,0,0,.05);padding:4px 8px;border-radius:4px;margin:2px 0;font-size:12px">🔧 <b>' + tc.name + '</b>' + (tc.result ? (' → ' + (tc.result.ok ? '✅' : '❌')) : ' ⏳') + '</div>').join('');
            streamDiv.innerHTML = html;
          } else if (evt.type === 'tool_result') {
            let tc = toolCalls.find(t => t.name === evt.tool && !t.result);
            if (tc) tc.result = evt.result;
          } else if (evt.type === 'done') {
            turns = evt.turns;
            fullText = evt.text || fullText;
          } else if (evt.type === 'error') {
            fullText += '\n\n❌ ' + evt.error;
          }
        } catch(e) {}
      }
      log.scrollTop = log.scrollHeight;
    }
    // 完成渲染
    let finalHtml = '<div class="role">🤖 ' + (agentModel||'Agent') + ' · 完成 (' + turns + ' 轮)</div>';
    if (fullText) finalHtml += renderMD(fullText);
    if (toolCalls.length) {
      finalHtml += '<div style="margin-top:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:4px">🔧 工具调用: ' + toolCalls.map(tc => tc.name + (tc.result && tc.result.ok ? '✅' : '❌')).join(', ') + '</div>';
    }
    streamDiv.innerHTML = finalHtml;
  } catch(e) {
    streamDiv.innerHTML = '<div class="role">❌ 错误</div>Agent 执行失败: ' + e.message + '<br><small>请确认编排器(5001)在运行，且 Agent 模块已加载</small>';
  }
  btn.disabled = false; btn.textContent = '执行';
  log.scrollTop = log.scrollHeight;
}

// ═══════ Multi-Agent Team ═══════
async function teamSend() {
  const input = document.getElementById('agentTask');
  const btn = document.getElementById('teamBtn');
  const task = input.value.trim();
  if (!task) return;
  input.value = ''; input.style.height = 'auto';
  btn.disabled = true; btn.textContent = '⏳';
  const log = document.getElementById('agentLog');

  const taskDiv = document.createElement('div');
  taskDiv.className = 'msg user';
  taskDiv.innerHTML = '<div class="role">👥 团队任务</div>' + task;
  log.appendChild(taskDiv);

  const streamDiv = document.createElement('div');
  streamDiv.className = 'msg assistant';
  streamDiv.innerHTML = '<div class="role">🤖 Agent 团队工作中...</div>';
  log.appendChild(streamDiv);

  let agentStates = {}; // agent_id -> {status, text, tools}
  let planSteps = [];

  try {
    const resp = await fetch(ORCH_API + '/api/team/stream', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({task: task})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        try {
          const evt = JSON.parse(line.slice(6));
          const type = evt.type;
          if (type === 'plan') {
            planSteps = evt.detail || [];
            let html = '<div class="role">👥 团队计划 (' + evt.steps + ' 步)</div>';
            planSteps.forEach((s,i) => {
              html += `<div style="font-size:12px;margin:2px 0;padding:4px 8px;border-radius:4px;background:var(--accent-light)">
                ${i+1}. [${s.role}] ${s.task.slice(0,80)}</div>`;
            });
            streamDiv.innerHTML = html;
          } else if (type === 'thinking') {
            const aid = evt.agent_id || '?';
            if (!agentStates[aid]) agentStates[aid] = {status:'working', text:'', tools:[]};
            agentStates[aid].text = (evt.text||'').slice(-200);
            renderTeamStatus();
          } else if (type === 'tool_call') {
            const aid = evt.agent_id || '?';
            if (!agentStates[aid]) agentStates[aid] = {status:'working', text:'', tools:[]};
            agentStates[aid].tools.push({name:evt.tool, ok:null});
            renderTeamStatus();
          } else if (type === 'tool_result') {
            const aid = evt.agent_id || '?';
            if (agentStates[aid]) {
              const tc = agentStates[aid].tools.find(t=>t.name===evt.tool&&t.ok===null);
              if (tc) tc.ok = evt.result?.ok || false;
            }
            renderTeamStatus();
          } else if (type === 'step_done') {
            const aid = evt.agent_id || '?';
            if (agentStates[aid]) agentStates[aid].status = 'done';
            renderTeamStatus();
          } else if (type === 'step_error') {
            const aid = evt.agent_id || '?';
            if (!agentStates[aid]) agentStates[aid] = {status:'error', text:'', tools:[]};
            agentStates[aid].status = 'error';
            renderTeamStatus();
          } else if (type === 'done') {
            let html = '<div class="role">👥 团队完成 (' + evt.steps + ' 步)</div>';
            const result = evt.result || {};
            if (result.text) html += renderMD(result.text.slice(0, 1000));
            streamDiv.innerHTML = html;
          }
        } catch(e) {}
      }
      log.scrollTop = log.scrollHeight;
    }
  } catch(e) {
    streamDiv.innerHTML = '<div class="role">❌ 团队执行失败</div>' + e.message;
  }
  btn.disabled = false; btn.textContent = '团队';
  log.scrollTop = log.scrollHeight;

  function renderTeamStatus() {
    let html = '<div class="role">👥 Agent 团队工作中...</div>';
    for (let [aid, state] of Object.entries(agentStates)) {
      const emoji = state.status === 'done' ? '✅' : state.status === 'error' ? '❌' : '🔄';
      const roleName = planSteps.find(s => ('agent_'+planSteps.indexOf(s)) === aid)?.role ||
                       (aid === 'synthesizer' ? 'synthesizer' : aid);
      html += `<div style="margin:4px 0;padding:6px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-size:12px">
        ${emoji} <b>${roleName}</b> ${state.status === 'working' ? '· 工作中' : ''}
        ${state.text ? `<div style="color:var(--muted);margin-top:2px">${state.text}</div>` : ''}
        ${state.tools.length ? `<div style="margin-top:2px">🔧 ${state.tools.map(t=>t.name+(t.ok===true?'✅':t.ok===false?'❌':'⏳')).join(', ')}</div>` : ''}
      </div>`;
    }
    streamDiv.innerHTML = html;
    log.scrollTop = log.scrollHeight;
  }
}

      `<div class="model-row">
        <span><b>${t.description}</b><br><span class="size">${t.schedule} · 下次: ${t.next_run?.slice(11,16)||'?'} · ${t.enabled?'🟢':'⚪'}</span></span>
        <button class="del" onclick="delSchedTask('${t.id}')">×</button>
      </div>`
    ).join('') || '<p style="color:var(--muted)">暂无定时任务</p>';
  } catch(e) { panel.innerHTML = '<p style="color:#ef4444">加载失败</p>'; }
}

async function addSchedTask() {
  let desc = document.getElementById('schedDesc').value.trim();
  let time = document.getElementById('schedTime').value;
  if (!desc) return;
  try {
    await fetch(ORCH_API + '/api/scheduler', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({task: desc, schedule: time})
    });
    document.getElementById('schedDesc').value = '';
    refreshSchedList();
  } catch(e) {}
}

async function delSchedTask(id) {
  try {
    await fetch(ORCH_API + '/api/scheduler/' + id, {method: 'DELETE'});
    refreshSchedList();
  } catch(e) {}
}

// ═══════ Voice Input ═══════
let voiceActive = false;
let recognition = null;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('浏览器不支持语音识别。请使用 Chrome 或 Edge。');
    return;
  }
  if (voiceActive) {
    recognition && recognition.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    voiceActive = true;
    document.getElementById('micBtn').textContent = '🔴';
    document.getElementById('micBtn').style.background = '#dc3545';
  };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    if (currentMode === 'chat') {
      document.getElementById('input').value = text;
    } else if (currentMode === 'agent') {
      document.getElementById('agentTask').value = text;
    }
  };
  recognition.onerror = () => { stopVoice(); };
  recognition.onend = () => { stopVoice(); };
  recognition.start();
}

function stopVoice() {
  voiceActive = false;
  const btn = document.getElementById('micBtn');
  if (btn) { btn.textContent = '🎤'; btn.style.background = 'var(--accent)'; }
}

// ═══════ Init ═══════
listModels();
switchChatModel();
updateTokenBar();
loadConvList();
</script>
