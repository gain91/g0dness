name: Build Tauri EXE

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0-x86_64-pc-windows-msvc

      - name: Install Tauri CLI (Rust)
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri
        working-directory: ai-suite-tauri/src-tauri
        run: cargo tauri build

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: AI_Suite_Installer
          path: ai-suite-tauri/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AI_Suite_EXE
          path: ai-suite-tauri/src-tauri/target/release/ai-suite.exe
