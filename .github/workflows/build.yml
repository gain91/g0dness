name: Build Tauri EXE

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install @tauri-apps/cli
        working-directory: ai-suite-tauri

      - name: Build Tauri
        run: npx tauri build
        working-directory: ai-suite-tauri

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AI_Suite_Installer
          path: ai-suite-tauri/src-tauri/target/release/bundle/nsis/*.exe

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ai-suite-tauri/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
